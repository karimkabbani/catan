    font-family:var(--serif); font-size:11px; font-size:3.6cqh; line-height:1.3;}
  /* corner count: white with a black outline (matches the original) */
  .dcount{position:absolute; bottom:4%; right:11%; color:#fff; font-weight:800; z-index:2;
    font-size:17px; font-size:5.6cqh;
    text-shadow:-1.4px -1.4px 0 #000, 1.4px -1.4px 0 #000, -1.4px 1.4px 0 #000, 1.4px 1.4px 0 #000, 0 2px 3px rgba(0,0,0,0.55);}
  /* buy card: label sits well below the (taller) card-fan imagery, then cost, then deck-remaining */
  .devcard2.buy .dtext{top:59%; font-weight:700; color:#23170a; font-size:13px; font-size:4cqh;}
  .dcost2{position:absolute; top:72%; left:0; right:0; display:flex; justify-content:center; align-items:center; z-index:2;
    gap:10px; gap:3cqh; font-weight:800; color:#23170a; font-size:13px; font-size:4.4cqh;}
  .dcost2 .ci{display:flex; align-items:center; gap:3px; gap:1cqh;}
  .dcost2 .ci img{width:20px; height:20px; width:6.4cqh; height:6.4cqh; object-fit:contain;}
  .dremain2{position:absolute; top:85.5%; left:6%; right:6%; text-align:center; z-index:2;
    font-size:12px; font-size:3.7cqh; font-weight:700; color:#3a2712;}
  /* nav arrows (green triangles) */
  .devnav{position:absolute; top:46%; transform:translateY(-50%); width:54px; height:60px; padding:0;
    border:none; background:none; cursor:pointer; z-index:3; display:flex; align-items:center; justify-content:center;}
  .devnav.left{left:4px;} .devnav.right{right:4px;}
  .devnav i{display:block; width:0; height:0; border-top:17px solid transparent; border-bottom:17px solid transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.6));}
  .devnav.left i{border-right:26px solid #54a012;}
  .devnav.right i{border-left:26px solid #54a012;}
  .devnav:active{transform:translateY(-50%) scale(0.92);}
  /* slim resource bar at the bottom (mirrors the in-game strip) */
  .devbar{display:flex; align-items:flex-end; justify-content:center; gap:30px; padding:0 38px 7px;
    background:linear-gradient(rgba(74,42,17,0.62),rgba(34,19,7,0.82)), var(--wood-tex); background-size:cover;
    border-top:2px solid var(--wood-edge); box-shadow:0 -3px 12px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,220,170,0.18);}
  .devclose,.devok{position:absolute; bottom:14px; width:54px; height:54px; padding:0; border:none; background:none; cursor:pointer; z-index:4;}
  .devclose{left:16px;} .devok{right:16px;}
  .devclose img,.devok img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.55));}
  .devok.hidden{display:none;}
  /* play-confirmation panel */
  .devconfirm{position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; justify-content:flex-end;
    background:rgba(0,0,0,0.45); animation:fadein .15s ease;}
  .dcpanel{position:relative; height:60%; display:flex; flex-direction:column; align-items:center;
    background:linear-gradient(rgba(74,42,17,0.97),rgba(40,22,8,0.99)), var(--wood-tex); background-size:cover;
    border:2px solid var(--gold-edge); border-radius:14px 14px 0 0; box-shadow:0 -12px 44px rgba(0,0,0,0.65);
    animation:sheetup .24s cubic-bezier(.2,.9,.3,1.1);}
  .dcbanner{align-self:stretch; height:38px; line-height:38px; text-align:center; color:#fff;
    font-family:var(--serif); font-size:19px; letter-spacing:.4px; text-shadow:0 1px 3px #000;
    background:linear-gradient(180deg,#2b5c96,#1a3e6e); border-radius:11px 11px 0 0;}
  .dcq{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 14%;
    color:var(--gold); font-family:var(--serif); font-size:clamp(16px,3.2vh,24px); line-height:1.35;}
  .dcbtn{position:absolute; bottom:18px; width:62px; height:62px; padding:0; border:none; background:none; cursor:pointer;}
  .dcbtn img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 6px #000);}
  .dcbtn.no{left:22px;} .dcbtn.yes{right:22px;}
  .dcbtn:active{transform:scale(0.93);}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  /* online: title-screen controls + lobby */
  .t-or{text-align:center; color:#caa44e; font-size:12px; margin:10px 0 7px; letter-spacing:.3px; opacity:.85;}
  .t-online{display:flex; flex-direction:column; gap:7px;}
  .t-join{display:flex; gap:7px;}
  .t-join input{flex:1; background:rgba(0,0,0,0.32); border:1px solid var(--wood-edge); border-radius:8px; color:var(--ink);
    padding:9px; font-size:16px; font-weight:800; letter-spacing:3px; text-align:center; text-transform:uppercase;}
  .t-join .btn{flex:0 0 auto; padding:9px 16px;}
  .gamecode{font-family:var(--serif); color:var(--gold); font-size:42px; font-weight:800; letter-spacing:8px;
    text-align:center; margin:2px 0 4px; text-shadow:0 2px 6px rgba(0,0,0,0.6);}
  .loblist{margin:12px 0; display:flex; flex-direction:column; gap:6px;}
  .lobrow{display:flex; align-items:center; gap:9px; padding:9px 12px; font-weight:700; color:var(--ink);
    background:rgba(0,0,0,0.26); border:1px solid rgba(0,0,0,0.4); border-radius:9px;}
  .lobrow.away{opacity:0.5;}   /* briefly dropped from presence (phone asleep) — kept during the grace window */
  /* a joinable table in the table-list */
  .tablerow{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left; cursor:pointer;
    padding:14px 16px; border-radius:12px; font-weight:700; font-family:var(--serif); font-size:16px; color:#3a2400;
    background:linear-gradient(180deg,#e8cf86,#c79b3f); border:1px solid var(--gold-edge); box-shadow:0 2px 6px rgba(0,0,0,0.35);}
  .tablerow:active{transform:scale(0.99);}
  /* the group's standing table — pinned first, visually the main door */
  .tablerow.home{border:2px solid var(--gold); box-shadow:0 0 0 1px rgba(233,196,90,0.35), 0 3px 8px rgba(0,0,0,0.4);}
  /* lobby chat — one shared conversation, shown in the games list AND the table lobby */
  .lchat{margin-top:10px; border-top:1px solid rgba(255,220,170,0.16); padding-top:8px;}
  .lchatlist{max-height:140px; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:4px; padding:2px 1px 6px;}
  .lcrow{display:flex; align-items:baseline; gap:7px; font-size:13.5px; line-height:1.35; text-align:left;}
  .lcname{flex:0 0 auto; color:var(--gold); font-weight:800;}
  .lcname.me{color:#9fd4ff;}
  .lctxt{color:var(--ink); min-width:0; overflow-wrap:anywhere;}
  .lctime{margin-left:auto; flex:0 0 auto; font-size:10.5px; color:var(--muted); opacity:0.8;}
  .lcempty{color:var(--muted); font-size:12.5px; text-align:center; padding:8px 0;}
  .lchatin{display:flex; gap:8px; align-items:center;}
  .lchatin input{flex:1; min-width:0; background:rgba(0,0,0,0.32); border:1px solid var(--wood-edge); border-radius:10px;
    color:var(--ink); padding:10px 11px; font-size:16px; font-family:var(--serif);}   /* 16px: no iOS zoom-on-focus */
  .lchatin .lchatgo{flex:0 0 auto; padding:10px 16px;}
  .tablerow .tnm2{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
  .tablerow .trow-main{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;}
  .tablerow .tgname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tablerow .tgwho{font-family:var(--sans,sans-serif); font-weight:600; font-size:12px; color:#6b4a1e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tablerow .t-acc, .tablerow .t-pend{flex:0 0 auto; color:#5a3a10; font-weight:800; font-size:13px;}
  .lobrow .cdot{width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 2px rgba(0,0,0,0.35);}
  /* identity / auth */
  /* landscape: 2-column player grid so names are big and the list stays short (no scroll, less down-scaling) */
  .authlist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:12px 0;}
  .authlist .btn{margin-top:0; width:auto;}   /* grid cells size the buttons; drop .full's margin/width */
  .authin{width:100%; box-sizing:border-box; background:rgba(0,0,0,0.32); border:1px solid var(--wood-edge);
    border-radius:8px; color:var(--ink); padding:11px; font-size:16px; margin:6px 0; text-align:center;}
  .auerr{color:#ff9a90; font-size:12px; text-align:center; min-height:16px; margin:2px 0;}
  /* ===== player faces (uploaded photo, else initial on a disc) ===== */
  .face{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%;
    overflow:hidden; flex:0 0 auto; background:radial-gradient(circle at 38% 32%, #5a4326, #2c1c0d); color:#f0dcb0;
    font-weight:800; font-family:var(--serif); font-size:18px; border:2px solid var(--gold-edge); box-shadow:0 1px 4px rgba(0,0,0,0.5);}
  .face img{width:100%; height:100%; object-fit:cover; display:block;}
  .face.sm{width:26px; height:26px; font-size:13px; border-width:1px;}
  .face.lg{width:104px; height:104px; font-size:46px; border-width:3px;}
  .authrow{display:flex !important; align-items:center; gap:12px; text-align:left; padding:12px 14px;}
  .authrow .anm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lobrow .tnm{display:flex; align-items:center; gap:8px; min-width:0;}
  .lobrow .tnm > span:nth-child(2){overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}   /* the name (a pref dot may follow) */
  /* ===== broadcast message banner (top-centre, ephemeral) ===== */
  #bctoast{position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 10px); transform:translateX(-50%) translateY(-14px);
    z-index:34; display:flex; align-items:center; gap:8px; max-width:86vw; pointer-events:none;
    background:linear-gradient(180deg, rgba(44,30,15,0.97), rgba(24,16,7,0.97)); border:1px solid var(--gold-edge);
    border-radius:22px; padding:6px 16px 6px 6px; color:#f4e7c8; font-size:14px; opacity:0; visibility:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,0.55); transition:opacity .2s ease, transform .2s ease, visibility .2s;}
  #bctoast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);}
  #bctoast .bcname{font-weight:800; color:var(--gold); flex:0 0 auto;}
  #bctoast .bctext{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  /* ===== broadcast chat bubble (anchored to the speaker's corner) ===== */
  .bcbubble{position:fixed; z-index:33; max-width:min(220px,56vw); background:#f6ecd2; color:#2a1c0c;
    border:1.5px solid var(--gold-edge); border-radius:13px; padding:8px 24px 8px 12px; font-size:13px; font-weight:600;
    line-height:1.25; box-shadow:0 6px 18px rgba(0,0,0,0.5); opacity:0; transform:scale(0.7);
    transition:opacity .16s ease, transform .16s cubic-bezier(.2,.9,.3,1.35);}
  .bcbubble.in{opacity:1; transform:scale(1);}
  .bcbubble.out{opacity:0; transform:scale(0.85);}
  .bcbubble .bctext{word-break:break-word;}
  .bcbubble.b-top{transform-origin:top;} .bcbubble.b-bot{transform-origin:bottom;}
  .bcbubble.b-left.b-top{transform-origin:top left;} .bcbubble.b-right.b-top{transform-origin:top right;}
  .bcbubble.b-left.b-bot{transform-origin:bottom left;} .bcbubble.b-right.b-bot{transform-origin:bottom right;}
  .bcclose{position:absolute; top:0; right:3px; width:18px; height:18px; border:none; background:none; cursor:pointer;
    color:#8a6a30; font-size:17px; line-height:18px; font-weight:800; padding:0;}
  /* tail: ::before is the gold border triangle, ::after the fill on top */
  .bcbubble::before, .bcbubble::after{content:''; position:absolute; width:0; height:0;}
  .bcbubble::before{border:9px solid transparent;}
  .bcbubble::after{border:7px solid transparent;}
  .bcbubble.b-top::before{top:-18px; border-bottom-color:var(--gold-edge);}
  .bcbubble.b-top::after{top:-14px; border-bottom-color:#f6ecd2;}
  .bcbubble.b-bot::before{bottom:-18px; border-top-color:var(--gold-edge);}
  .bcbubble.b-bot::after{bottom:-14px; border-top-color:#f6ecd2;}
  .bcbubble.b-left::before{left:14px;}  .bcbubble.b-left::after{left:16px;}
  .bcbubble.b-right::before{right:14px;} .bcbubble.b-right::after{right:16px;}
  /* ===== Manage Profile ===== */
  .profhead{display:flex; flex-direction:column; align-items:center; gap:10px; margin:6px 0 14px;}
  .profpic{position:relative; border:none; background:none; padding:0; cursor:pointer; line-height:0;}
  .profcam{position:absolute; right:-2px; bottom:-2px; width:32px; height:32px; border-radius:50%;
    background:linear-gradient(180deg,var(--gold),var(--gold-edge)); color:#3a2400; display:flex; align-items:center;
    justify-content:center; font-size:15px; border:2px solid #2c1c0d;}
  .profhbtns{display:flex; gap:8px;}
  .profhbtns .btn{padding:9px 16px; font-size:14px;}
  .proflbl{display:block; color:var(--muted); font-size:13px; margin:4px 2px 2px; text-align:left;}
  .profname{display:flex; gap:8px; align-items:center;}
  /* preferred-color picker: four swatches + a "no preference" pill */
  .prefrow{display:flex; align-items:center; gap:10px; margin:4px 0 12px;}
  .prefsw{width:38px; height:38px; border-radius:50%; border:2px solid rgba(0,0,0,0.45); cursor:pointer; padding:0;
    box-shadow:inset 0 2px 4px rgba(255,255,255,0.25), 0 2px 5px rgba(0,0,0,0.45);}
  .prefsw.on{border-color:#fff; box-shadow:0 0 0 3px var(--gold), inset 0 2px 4px rgba(255,255,255,0.25), 0 2px 5px rgba(0,0,0,0.45);}
  .prefsw:active{transform:scale(0.92);}
  .prefnone{margin-left:auto; padding:8px 12px; border-radius:11px; background:rgba(0,0,0,0.28); border:1px solid transparent;
    color:#f0dcb0; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; white-space:nowrap;}
  .prefnone.on{border-color:var(--gold); background:rgba(233,196,90,0.18); color:#fff;}
  /* table-lobby variant: compact picker next to the ready buttons + a pref dot on player rows */
  .lobprefrow{display:flex; align-items:center; gap:8px; margin:6px 0 8px;}
  .lobprefrow .lobtgt-lbl{margin-right:2px;}
  .prefsw.sm{width:26px; height:26px;}
  .prefnone.sm{margin-left:auto; padding:5px 10px; font-size:11.5px;}
  .lobprefdot{width:10px; height:10px; border-radius:50%; border:1px solid rgba(0,0,0,0.5); flex:0 0 auto;
    box-shadow:0 1px 2px rgba(0,0,0,0.4);}
  .profname .authin{flex:1 1 auto; min-width:0; margin:0;}
  .profname .btn{flex:0 0 auto; padding:11px 16px;}
  /* ===== photo cropper ===== */
  #cropper{position:fixed; inset:0; z-index:60; background:rgba(8,5,2,0.93); display:flex; align-items:center; justify-content:center; padding:16px;}
  #cropper.hidden{display:none;}
  .cropwrap{display:flex; flex-direction:column; align-items:center; gap:14px; width:min(420px,94vw);}
  .cropwrap h3{color:var(--gold); font-family:var(--serif); margin:0;}
  .cropframe{position:relative; width:min(76vw,300px); height:min(76vw,300px); overflow:hidden; touch-action:none;
    border-radius:10px; background:#000; cursor:grab;}
  .cropimg{position:absolute; left:50%; top:50%; transform-origin:center center; user-select:none; -webkit-user-drag:none; max-width:none; max-height:none;}
  .cropmask{position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 9999px rgba(0,0,0,0.5); pointer-events:none;}
  .cropzoom{width:82%; accent-color:var(--gold);}
  .cropbtns{display:flex; gap:12px; width:100%;}
  .cropbtns .btn{flex:1;}
  .lobby-foot{display:flex; gap:8px; margin-top:10px;}
  .lobby-foot .btn{flex:1; font-size:14px; padding:14px 9px;}
  /* lobby header: back arrow (left) · title · subtle tool icons (profile/stats) right */
  .lobhead{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .t-card .lobhead h3{margin:0; text-align:left; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lobback{width:32px; height:32px; border-radius:50%; border:1px solid rgba(0,0,0,0.3); background:rgba(28,15,6,0.42);
    display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1; padding:0 0 2px; cursor:pointer; opacity:0.85; flex-shrink:0; color:var(--gold);}
  .lobback:active{transform:translateY(1px);}
  .lobtools{display:flex; align-items:center; gap:7px; flex-shrink:0;}
  .lobtool{width:32px; height:32px; border-radius:50%; border:1px solid rgba(0,0,0,0.3); background:rgba(28,15,6,0.42);
    display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; padding:0; cursor:pointer; opacity:0.85;}
  .lobtool:active{transform:translateY(1px);}
  .lobtool.lobav{border:none; background:none; opacity:1;}
  .lobtool.lobav .face{width:32px; height:32px;}
  /* subtle "back to games" link (not a full button) */
  .loblink{display:block; width:fit-content; margin:10px auto 0; padding:5px 10px; background:none; border:none;
    color:var(--muted); font-size:13px; cursor:pointer;}
  .loblink:active{opacity:0.7;}
  /* recent-games strip (lobby) + stats screen list */
  .rgsec{margin-top:14px; border-top:1px solid rgba(255,220,170,0.14); padding-top:10px;}
  .rghead{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;}
  .rghead span{color:var(--gold); font-family:var(--serif); font-size:15px;}
  .rglink{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 4px;}
  .rglink:active{opacity:0.7;}
  .rglist{display:flex; flex-direction:column; gap:5px; max-height:128px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .rglist.tall{max-height:210px;}
  .rgrow{display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; background:rgba(0,0,0,0.22); font-size:13px;}
  .rgwin{color:var(--gold); font-weight:800; flex:0 0 auto; white-space:nowrap;}
  .rgfield{color:var(--ink); opacity:0.72; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rgdate{color:var(--muted); font-size:11px; flex:0 0 auto; white-space:nowrap;}
  /* stats leaderboard table */
  .sttbl-wrap{overflow-x:auto; margin-bottom:6px;}
  .sttbl{width:100%; border-collapse:collapse; font-size:14px;}
  .sttbl th{color:var(--muted); font-size:11px; font-weight:700; letter-spacing:0.03em; padding:5px 6px; text-align:center; border-bottom:1px solid rgba(255,220,170,0.18); white-space:nowrap;}
  .sttbl th:nth-child(2){text-align:left;}
  .sttbl td{padding:8px 6px; text-align:center; border-bottom:1px solid rgba(0,0,0,0.25); color:var(--ink); white-space:nowrap;}
  .sttbl td.stn{text-align:left; font-weight:700;}
  .sttbl td.str{color:var(--muted);}
  .sttbl td.stw{color:var(--gold); font-weight:800;}
  .sttbl td.stpos{color:#8fd98f; font-weight:700;}
  .sttbl td.stneg{color:#e3a3a3; font-weight:700;}
  .sttbl td.stpen{color:#ff5a4d; font-weight:800;}   /* quit penalties — stand out */
  .sttbl td.stgo{color:var(--muted); opacity:0.55; font-size:16px; padding-left:0; width:14px;}   /* rows are tappable — say so */
  .sttbl td.stz{color:var(--muted); opacity:0.5;}    /* zero penalties — muted dash */
  .sttbl tbody tr:first-child td.str{color:var(--gold);}
  .sttbl tbody tr{cursor:pointer;}
  .sttbl tbody tr:active{background:rgba(255,220,170,0.07);}
  .stnote{color:var(--muted); font-size:11px; text-align:center; margin:0 0 12px; font-style:italic; line-height:1.4;}
  .stsub{color:var(--gold); font-family:var(--serif); font-size:15px; margin:6px 0 7px; text-align:left;}
  .stseg{margin-bottom:12px;}
  .stcountseg{margin-top:-4px;}
  /* season strip: horizontally scrollable pills (All-time + one per month) */
  .stseasonseg{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; gap:7px;}
  .stseasonseg::-webkit-scrollbar{display:none;}
  .stseasonseg button{flex:0 0 auto; padding:9px 16px;}
  .stmonthrow{margin-top:-4px;}   /* month pills sit tight under the year row (multi-year mode) */
  /* per-player detail */
  .stchips{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:6px;}
  .stchip{background:rgba(0,0,0,0.25); border-radius:9px; padding:9px 5px; text-align:center;}
  .stcv{display:block; color:var(--gold); font-weight:800; font-size:16px; white-space:nowrap;}
  .stcl{display:block; color:var(--muted); font-size:10px; margin-top:2px; text-transform:uppercase; letter-spacing:0.03em;}
  .h2hlist{display:flex; flex-direction:column; gap:5px; margin-bottom:2px;}
  .h2hrow{display:flex; justify-content:space-between; align-items:center; padding:8px 11px; border-radius:8px; background:rgba(0,0,0,0.22);}
  .h2hn{color:var(--ink);}
  .h2hr{font-weight:800; color:var(--muted); font-size:15px;}
  .h2hr.stpos{color:#8fd98f;}
  .h2hr.stneg{color:#e3a3a3;}
  .stbon{display:flex; gap:20px; align-items:center; flex-wrap:wrap; color:var(--ink); font-weight:700; font-size:14px;}
  .stbonico{height:15px; vertical-align:middle; margin-right:5px;}
  .stbonemo{margin-right:3px;}
  /* Ready / Spectate side-by-side in the lobby */
  /* host's win-target slider — subtle row above the ready/spectate buttons */
  .lobtgt{display:flex; align-items:center; gap:10px; margin:8px 2px 6px; font-size:13px;}
  .lobtgt-lbl{color:var(--muted); white-space:nowrap;}
  .lobtgt-lbl b{color:var(--gold); font-weight:800;}
  .lobtgt.muted{color:var(--muted); justify-content:center;}
  .lobtgt.muted b{color:var(--gold); font-weight:800;}
  .lobtgt-slider{flex:1; min-width:0; height:22px; -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer;}
  .lobtgt-slider::-webkit-slider-runnable-track{height:4px; border-radius:3px; background:linear-gradient(90deg,var(--gold-edge),var(--gold)); box-shadow:inset 0 1px 2px rgba(0,0,0,0.5);}
  .lobtgt-slider::-moz-range-track{height:4px; border-radius:3px; background:linear-gradient(90deg,var(--gold-edge),var(--gold));}
  .lobtgt-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:18px; height:18px; margin-top:-7px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#ffe9ab,#c79a3e); border:1.5px solid #7a5c24; box-shadow:0 2px 5px rgba(0,0,0,0.5);}
  .lobtgt-slider::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#ffe9ab,#c79a3e); border:1.5px solid #7a5c24;}
  .lobrow2{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:4px;}
  /* "👁 N" watching badge in the in-game banner */
  .watchtag{margin-left:8px; font-size:0.85em; opacity:0.85; padding:1px 7px; border-radius:10px; background:rgba(0,0,0,0.3);}
  .loblist .lobrow{justify-content:space-between;}
  /* trade screen */
  /* ===== trade: half-height wood sheet, board shows above, 3-row placeholder grid ===== */
  #overlay.menu.trademode{align-items:stretch; background:none;}
  body.trading #banner, body.trading .corner, body.trading #dock{display:none !important;}
  /* fixed to the DYNAMIC viewport so the mobile-browser URL bar can't push the sheet
     (and its buttons) off-screen — dvh tracks the visible height, vh is the fallback */
  .traderoot{position:fixed; left:0; right:0; top:0; height:100vh; height:100dvh;}
  .ttitle2{position:absolute; top:1.6%; left:0; right:0; text-align:center; color:#fff; font-family:var(--serif);
    font-size:clamp(18px,3.6vh,28px); letter-spacing:.4px; text-shadow:0 2px 5px #000;}
  /* the wooden table — bottom ~56%, board visible above it */
  .tradesheet{position:absolute; left:0; right:0; bottom:0; height:56%; display:flex; flex-direction:column;
    background:linear-gradient(rgba(70,40,16,0.55),rgba(34,19,7,0.86)), var(--wood-tex); background-size:cover;
    border-top:3px solid var(--gold-edge); box-shadow:0 -10px 34px rgba(0,0,0,0.55);
    padding:clamp(30px,6vh,52px) 2% calc(8px + env(safe-area-inset-bottom,0px)); animation:sheetup .26s cubic-bezier(.2,.9,.3,1.1);}
  /* targets straddle the sheet's top edge; players centred, the bank chest off to the right */
  .ttargets{position:absolute; left:0; right:0; top:0; transform:translateY(-54%);
    display:flex; align-items:flex-end; justify-content:center; gap:clamp(8px,2.5vw,24px);}
  .ttarget.chest{position:absolute; right:clamp(16px,7vw,90px); bottom:0;}
  .ttarget{cursor:pointer; opacity:0.55; transition:opacity .14s, transform .14s; transform:scale(0.92); line-height:0;}
  .ttarget.on{opacity:1; transform:scale(1);}
  .tav{width:clamp(46px,8.5vh,80px); height:clamp(46px,8.5vh,80px); border-radius:11px; overflow:hidden;
    border:3px solid #caa24a; box-shadow:0 3px 9px rgba(0,0,0,0.55); background:#2a1c0c;}
  .tav img{width:100%; height:100%; object-fit:cover;}
  .ttarget.on .tav{box-shadow:0 0 0 3px var(--gold), 0 3px 10px rgba(0,0,0,0.6);}
  .tchest{width:clamp(58px,10.5vh,98px); height:auto; vertical-align:bottom; filter:drop-shadow(0 3px 7px rgba(0,0,0,0.6));}
  .ttarget.chest.on .tchest{filter:drop-shadow(0 0 7px var(--gold)) drop-shadow(0 3px 7px rgba(0,0,0,0.6));}
  /* 3-row resource grid: give slot · hand · want slot */
  .tgrid{flex:1; display:flex; align-items:center; justify-content:center; gap:clamp(6px,2.6vw,26px); min-height:0;}
  .tcol{display:flex; flex-direction:column; align-items:center; gap:clamp(5px,1.5vh,13px); flex:1 1 0; max-width:120px;
    touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer;}
  /* placeholder slot: blackish well; shows the resource + count once swiped in */
  .tslot{position:relative; width:clamp(38px,7.4vh,62px); height:clamp(38px,7.4vh,62px); border-radius:50%;
    background:radial-gradient(circle at 50% 36%, rgba(0,0,0,0.40), rgba(0,0,0,0.66));
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.7), inset 0 -1px 0 rgba(255,255,255,0.05);}
  /* arrow hint + resource icon are both ALWAYS laid out (centred, absolute); we only
     fade between them via opacity. Never display:none an <img> here — toggling that on
     iOS WebKit flashes the image at its intrinsic size first ("giant wheat" bug). */
  .tslot .ahint, .tslot .rimg{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    pointer-events:none; transition:opacity .12s;}
  .tslot .ahint{width:40%; height:auto; opacity:0.55;}
  .tslot .rimg{width:86%; height:86%; object-fit:contain; opacity:0; filter:drop-shadow(0 1px 2px #000a);}
  .tslot.filled{background:radial-gradient(circle at 50% 36%, rgba(20,10,2,0.32), rgba(0,0,0,0.5));}
  .tslot.filled .ahint{opacity:0;}
  .tslot.filled .rimg{opacity:1;}
  .tslot.noarrow .ahint{opacity:0;}   /* a resource you hold 0 of can't be discarded — no arrow */
  .tslot .sct{position:absolute; bottom:-2px; right:-3px; color:#fff; font-weight:800; font-size:clamp(11px,1.9vh,16px);
    opacity:0; transition:opacity .12s; text-shadow:-1.2px -1.2px 0 #000,1.2px -1.2px 0 #000,-1.2px 1.2px 0 #000,1.2px 1.2px 0 #000;}
  .tslot.filled .sct{opacity:1;}
  .tmid{position:relative; width:clamp(46px,8.6vh,74px); height:clamp(46px,8.6vh,74px); display:flex; align-items:center; justify-content:center;}
  .tmid img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 4px #0008); pointer-events:none;}
  .tmid .tcount{position:absolute; bottom:-2px; right:-3px; color:#fff; font-weight:800; font-size:clamp(12px,2vh,17px);
    text-shadow:-1.3px -1.3px 0 #000,1.3px -1.3px 0 #000,-1.3px 1.3px 0 #000,1.3px 1.3px 0 #000;}
  /* ratios are always in the DOM (so switching modes doesn't rebuild the sheet); shown only for the bank */
  .tratio{color:#f1e3c2; font-weight:800; font-size:clamp(11px,1.8vh,15px); text-shadow:0 1px 2px #000; display:none;}
  .tradesheet.bank .tratio{display:block;}
  /* cancel + confirm (✓ only shows when the trade is valid) */
  .tclose,.tconfirm{position:absolute; bottom:calc(13px + env(safe-area-inset-bottom,0px)); width:clamp(46px,7.5vh,60px); height:clamp(46px,7.5vh,60px);
    padding:0; border:none; background:none; cursor:pointer; z-index:4;}
  .tclose{left:16px;} .tconfirm{right:16px;}
  .tclose img,.tconfirm img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.55));}
  .tconfirm.hidden{display:none;}
  /* responder counter sheet: the offerer's face + offer summary above the same swipe sheet */
  .traderoot.respond .tradesheet{height:52%;}
  .tofferhead{position:absolute; left:0; right:0; top:clamp(6px,2vh,20px); display:flex; align-items:center; justify-content:center; gap:10px; z-index:3; padding:0 12px;}
  .tofferhead .tav{width:clamp(40px,7vh,64px); height:clamp(40px,7vh,64px);}
  .tofferline{color:#fff; font-family:var(--serif); font-size:clamp(13px,2.4vh,19px); text-shadow:0 2px 5px #000; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;}
  .tofferline .for{opacity:0.7; margin:0 2px;}
  .tofferline .ri, .t-cnt .ri{width:clamp(15px,2.3vh,21px); height:auto; vertical-align:middle;}
  .tnote{position:absolute; left:0; right:0; bottom:calc(76px + env(safe-area-inset-bottom,0px)); text-align:center; color:#f1e3c2; font-size:13px; text-shadow:0 1px 2px #000; z-index:4;}
  /* auto-decline-this-turn: down/up arrows with a slash, bottom-centre */
  /* responder buttons: auto-decline stacked ABOVE the X, bottom-left, clear of the resources */
  .trespbtns{position:absolute; left:16px; bottom:calc(13px + env(safe-area-inset-bottom,0px)); z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:9px;}
  .trespbtns .tclose{position:static; left:auto; bottom:auto;}
  .tautodecline{position:relative; width:clamp(44px,7.2vh,58px); height:clamp(44px,7.2vh,58px); padding:0; border:none; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 50% 40%, #6a4a22, #2c1c0c); box-shadow:0 3px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;}
  .tautodecline img{width:32%; height:auto; filter:drop-shadow(0 1px 1px #000a);}
  .tautodecline .tadg{margin-right:-3px;}
  .tautodecline::after{content:""; position:absolute; left:16%; right:16%; top:47%; height:3px; background:#d64b3f;
    transform:rotate(-34deg); border-radius:2px; box-shadow:0 0 0 1px #0007;}
  /* offerer wait list: counter chip + footer row */
  .t-cnt{color:#e6c66a; font-weight:700; font-size:12px; display:inline-flex; align-items:center; gap:3px; flex-wrap:wrap;}
  .t-cnt .for{opacity:0.7;}
  .trow2.tfoot{justify-content:center; gap:10px; margin-top:6px;}
  .trow2.tfoot .btn{flex:0 0 auto; padding:8px 16px;}
  /* offerer corner badges: ✓ accepted / ✗ declined / ? counter / … deciding — on the board-facing edge */
  .tbadge{position:absolute; top:-9px; left:50%; transform:translateX(-50%); z-index:9; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; line-height:1; color:#fff;
    border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.6);}
  .corner.tl .tbadge, .corner.tr .tbadge{top:auto; bottom:-9px;}
  .tbadge.acc{background:#3da34d; cursor:pointer;}
  .tbadge.dec{background:#cf3b34;}
  .tbadge.counter{background:#e0a72a; cursor:pointer;}
  .tbadge.wait{background:#6b6b6b; font-size:12px;}
  /* offerer prompt bar (online): the offer + New offer / Cancel, or a tapped response + Trade */
  #tradeprompt{position:fixed; left:50%; bottom:calc(12px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30;
    display:none; flex-direction:column; align-items:center; gap:7px; max-width:94vw;
    background:linear-gradient(rgba(60,34,12,0.95),rgba(34,19,7,0.97)), var(--wood-tex); background-size:cover;
    border:1.5px solid var(--gold-edge); border-radius:12px; padding:10px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.55);}
  #tradeprompt .tpoffer{color:#fff; font-family:var(--serif); font-size:15px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:center; text-align:center;}
  #tradeprompt .tpoffer .for{opacity:0.7;}
  #tradeprompt .tpoffer .ri{width:18px; height:auto; vertical-align:middle;}
  #tradeprompt .tpmsg{color:var(--muted); font-size:12px;}
  #tradeprompt .tpbtns{display:flex; gap:10px;}
  #tradeprompt .tpbtns .btn{padding:8px 18px; margin:0; width:auto;}

  /* ===== start-of-turn "Question" dialog (play knight before rolling?) ===== */
  #overlay.qmode{background:rgba(0,0,0,0.3);}
  .qdlg{width:min(92%,640px); border-radius:14px; overflow:hidden; border:2px solid var(--gold-edge);
    box-shadow:0 14px 50px rgba(0,0,0,0.65); animation:qpop .2s cubic-bezier(.2,.9,.3,1.1);}
  @keyframes qpop{from{transform:scale(0.94);opacity:0} to{transform:scale(1);opacity:1}}
  .qbanner{height:42px; line-height:42px; text-align:center; color:#fff; font-family:var(--serif);
    font-size:clamp(17px,2.7vh,23px); letter-spacing:.4px; text-shadow:0 1px 3px #000;
    background:linear-gradient(180deg,#2b5c96,#1a3e6e);}
  .qbody{padding:clamp(14px,3vh,26px) clamp(14px,4vw,40px) clamp(16px,3vh,28px);
    background:linear-gradient(rgba(74,42,17,0.96),rgba(40,22,8,0.98)), var(--wood-tex); background-size:cover;}
  .qtext{text-align:center; color:var(--gold); font-family:var(--serif); font-size:clamp(16px,2.7vh,22px);
    line-height:1.35; margin:0 0 clamp(14px,2.6vh,22px);}
  .qbtn{display:block; width:100%; max-width:420px; margin:0 auto clamp(9px,1.6vh,13px); padding:clamp(10px,1.9vh,15px);
    border-radius:9px; cursor:pointer; font-family:var(--serif); font-size:clamp(15px,2.4vh,19px); color:#f1e6cf;
    background:linear-gradient(180deg,#3a4047,#23272c); border:2px solid #b9923f;
    box-shadow:0 3px 7px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08); text-shadow:0 1px 2px #000;}
  .qbtn:last-child{margin-bottom:0;}
  .qbtn:active{transform:translateY(1px); filter:brightness(0.95);}
  /* "X Card bought." acknowledge check */
  .devboughtok{display:block; margin:clamp(6px,1.4vh,12px) auto 0; width:clamp(54px,8vh,66px); height:clamp(54px,8vh,66px);
    padding:0; border:none; background:none; cursor:pointer;}
  .devboughtok img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 6px #000);}
  .devboughtok:active{transform:scale(0.93);}
  .toffer{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; color:var(--ink); font-weight:700; font-size:16px; padding:10px 12px;}
  .toffer .for{color:var(--muted); font-weight:400; font-style:italic;}
  .toffer .ri{width:22px; height:22px; vertical-align:-5px;}
  .tresp{display:flex; flex-direction:column; gap:8px; padding:6px 16px; max-width:480px; margin:0 auto; width:100%;}
  .tresp .trow2{display:flex; align-items:center; gap:10px; justify-content:space-between; background:rgba(0,0,0,0.24);
    border:1px solid rgba(0,0,0,0.4); border-radius:9px; padding:8px 12px;}
  .trow2{display:flex; align-items:center; gap:10px; justify-content:center;}
  .tnm{flex:1; font-weight:700; color:var(--ink); text-align:left;}
  .t-acc{color:#7fe089; font-weight:800;} .t-dec{color:#ff9a90; font-weight:800;} .t-pend{color:var(--muted);}
  .menuscreen.trade .btn.full{display:block; max-width:380px; margin:8px auto;}

  /* dev-card faces in the play-card overlay */
  .cardrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
  .dcard{width:92px;cursor:pointer;text-align:center;}
  .dcard img{width:92px;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,0.5);border:1px solid #0006;}
  .dcard:active img{transform:translateY(1px);}
  .dcard span{display:block;font-size:11px;color:var(--ink);margin-top:3px;}

  /* bottom dock: hand + actions */
  #dock{position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:auto; max-width:96vw; padding:0; z-index:6;}
  /* slim resource strip, flush to the bottom (rounded top only) */
  /* slim half-height strip: the round icons overhang its top edge (the bar cuts
     through them at the middle, from behind), with each count to the icon's right */
  #hand{display:flex;align-items:flex-end;justify-content:center;gap:30px;
    background:linear-gradient(rgba(74,42,17,0.62),rgba(34,19,7,0.82)), var(--wood-tex);
    background-size:cover; border:2px solid var(--wood-edge); border-bottom:none; border-radius:12px 12px 0 0;
    padding:0 38px 7px;
    box-shadow:0 -3px 12px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,220,170,0.18);}
  .handname{font-size:12px;font-weight:700;color:var(--gold);margin-right:3px;text-shadow:0 1px 2px #000;}
  /* each resource: round icon + count to its right; pulled up so half the icon
     sits above the bar (the slim bar's top edge crosses the icon's middle) */
  .res{display:inline-flex;align-items:center;gap:4px;height:36px;margin-top:-18px;}
  .res img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));}
  /* count sits down inside the bar (its top just below the bar's top edge) */
  .rcount{color:#fff;font-family:-apple-system,system-ui,'Segoe UI',Roboto,Arial,sans-serif;
    font-weight:700;font-size:14px;line-height:1;text-shadow:0 1px 3px #000,0 0 3px #000;
    position:relative;top:11px;}
  .chip{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.28);border:1px solid rgba(0,0,0,0.4);
    border-radius:9px;padding:3px 8px;font-size:14px;font-weight:700;min-width:42px;justify-content:center;}
  .chip .ic{font-size:15px;}
  /* spectator dock strip (replaces the resource hand for watchers) */
  body.spectating #hand, body.gameover #hand{align-items:center; padding:0 8px;}
  .spechand{display:flex; align-items:center; gap:9px; padding:9px 8px; color:#ffe6c2; font-size:13px; font-weight:700; white-space:nowrap; max-width:88vw;}
  .specdot{width:11px;height:11px;border-radius:50%;border:1px solid #0008;flex:0 0 auto;}
  .spectxt{overflow:hidden;text-overflow:ellipsis;}
  .specleave{flex:0 0 auto;background:rgba(0,0,0,0.3);color:#ffd7ad;border:1px solid var(--gold-edge);border-radius:10px;
    padding:4px 13px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;margin-left:2px;}
  .specleave:active{transform:translateY(1px);}
  /* spectator resource inspector: player chips + the selected player's resource orbs */
  .spechand.specview{gap:10px; max-width:96vw;}
  .speceye{flex:0 0 auto; font-size:15px;}
  .specsel{display:flex; align-items:center; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .specpl{display:flex; align-items:center; gap:5px; flex:0 0 auto; padding:5px 9px; border-radius:11px;
    background:rgba(0,0,0,0.28); border:1px solid transparent; color:#f0dcb0; font-size:12.5px; font-weight:700;
    font-family:inherit; cursor:pointer; white-space:nowrap;}
  .specpl.turn{background:rgba(233,196,90,0.12);}
  .specpl.on{border-color:var(--gold); background:rgba(233,196,90,0.22); color:#fff;}
  .specpl:active{transform:scale(0.96);}
  .specorbs{display:flex; align-items:center; gap:13px; flex:0 0 auto;}
  .specorbs .res{display:flex; align-items:center; gap:3px;}
  .specorbs .res img{width:24px; height:24px;}
  .specorbs .rcount{font-size:14px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;}
  /* dice faces in the banner */
  .dice{display:inline-flex;align-items:center;gap:4px;margin-left:6px;}
  .dice img{width:22px;height:22px;filter:drop-shadow(0 1px 1px #000);}
  .dval{color:var(--gold);font-weight:800;margin-left:2px;}
  #log{text-align:center;font-size:11px;color:#cfe6ff;margin:3px 0 0;min-height:13px;text-shadow:0 1px 2px #0008;}
  #actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .btn{background:linear-gradient(180deg,#d8b258,#a9802a); color:#3a2400; border:1px solid var(--gold-edge);
    border-radius:10px; padding:9px 13px; font-size:14px; font-weight:700; cursor:pointer; letter-spacing:.2px;
    box-shadow:0 2px 5px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);}
  .btn:active{transform:translateY(1px);}
  .btn.wood{background:linear-gradient(rgba(80,46,18,0.35),rgba(40,22,10,0.55)), var(--wood-tex);
    background-size:cover; color:var(--ink); border-color:var(--wood-edge);
    text-shadow:0 1px 2px #000; box-shadow:0 2px 5px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,220,170,0.2);}
  /* build-menu icon buttons (framed piece art) */
  .btn.iconbtn{padding:0;border:none;background:none;box-shadow:none;width:84px;}
  .btn.iconbtn img{width:84px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));}
  .btn.iconbtn:active{transform:translateY(1px);}
  .btn.iconbtn.disabled img{filter:grayscale(0.8) brightness(0.6);}
  .btn.end{background:linear-gradient(180deg,#a8413f,#7a2422); color:#fff; border-color:#5a1a18;}
  /* faint fill (not fully transparent) so the button reliably receives taps — a
     transparent background lets the hit fall through to the parent on some engines. */
  .btn.ghost{background:rgba(28,15,6,0.45);color:var(--muted);box-shadow:none;border-color:#0005;}
  .btn.disabled,.btn:disabled{opacity:0.45;}
  .hint{font-size:13px;color:var(--ink);background:rgba(20,10,4,0.6);border:1px solid var(--wood-edge);
    border-radius:10px;padding:8px 14px;text-align:center;}

  /* overlays */
  #overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:30;
    animation:fadein .18s ease;}
  #overlay.hidden{display:none;}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  @keyframes sheetin{from{opacity:0; transform:translateY(14px) scale(0.96)} to{opacity:1; transform:none}}
  /* small inline resource icon used inside overlays */
  .ri{width:22px;height:22px;vertical-align:-6px;object-fit:contain;filter:drop-shadow(0 1px 1px #0008);}
  /* victory screen */
  .winwrap{text-align:center;}
  .winhead{position:relative;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
  /* rotating sun-rays behind the winner */
  .winrays{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-46%);
    background:repeating-conic-gradient(from 0deg, rgba(233,196,90,0.30) 0deg 6deg, transparent 6deg 20deg);
    border-radius:50%;pointer-events:none;z-index:0;
    -webkit-mask:radial-gradient(circle, transparent 30%, #000 33%, #000 60%, transparent 66%);
            mask:radial-gradient(circle, transparent 30%, #000 33%, #000 60%, transparent 66%);
    animation:raysspin 14s linear infinite, fadein .6s ease both;}
  @keyframes raysspin{to{transform:translate(-50%,-46%) rotate(360deg);}}
  .winwrap .crown{width:66px;height:auto;position:relative;z-index:2;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));transform-origin:center bottom;
    animation:crowndrop .7s cubic-bezier(.2,.9,.3,1.35) both, crownfloat 2.8s ease-in-out .8s infinite;}
  @keyframes crowndrop{0%{transform:translateY(-46px) scale(0.3) rotate(-18deg);opacity:0}
    55%{transform:translateY(8px) scale(1.18) rotate(4deg);opacity:1}
    78%{transform:translateY(-4px) scale(0.96) rotate(-2deg)}
    100%{transform:translateY(0) scale(1) rotate(0)}}
  @keyframes crownfloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  .winava{width:84px;height:84px;border-radius:50%;margin:6px auto 0;border:3px solid var(--gold);overflow:hidden;
    position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
    animation:avapop .55s cubic-bezier(.2,.9,.3,1.5) .15s both, glowpulse 1.9s ease-in-out .8s infinite;}
  @keyframes avapop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes glowpulse{0%,100%{box-shadow:0 0 18px 2px rgba(233,196,90,0.55)}50%{box-shadow:0 0 38px 9px rgba(233,196,90,0.95)}}
  .winava img{width:100%;height:100%;object-fit:cover;}
  .winwrap h2{font-family:var(--serif);color:var(--gold);font-size:27px;margin:8px 0 4px;
    text-shadow:0 2px 12px rgba(233,196,90,0.55);
    animation:h2pop .5s cubic-bezier(.2,.9,.3,1.35) .32s both;}
  @keyframes h2pop{0%{opacity:0;transform:scale(0.55)}70%{transform:scale(1.09)}100%{opacity:1;transform:scale(1)}}
  /* Domination — blowout win where every rival was held under 10 */
  .dombadge{display:inline-flex; flex-direction:column; align-items:center; gap:2px; margin:2px auto 6px;
    padding:6px 22px; border-radius:11px; font-family:var(--serif); font-weight:800; letter-spacing:2px;
    font-size:21px; color:#2a1605; background:linear-gradient(180deg,#ffd76b,#d8a52f);
    border:1px solid #fff3cf; box-shadow:0 4px 16px rgba(216,165,47,0.6), inset 0 1px 0 rgba(255,255,255,0.7);
    text-shadow:0 1px 0 rgba(255,255,255,0.4); animation:dompop .55s cubic-bezier(.2,.9,.3,1.5) .55s both;}
  .dombadge span{font-size:10px; font-weight:700; letter-spacing:1px; color:#5a3a10; text-transform:uppercase;}
  @keyframes dompop{0%{opacity:0;transform:scale(0.4) rotate(-6deg)}65%{transform:scale(1.12) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  .winwrap.domination h2{color:#ffe08a; text-shadow:0 0 18px rgba(255,200,90,0.85), 0 2px 12px rgba(233,196,90,0.6);}
  .winwrap.domination .winrays{filter:hue-rotate(-12deg) saturate(1.3) brightness(1.15);}
  .standing{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 10px;margin:4px 0;
    background:rgba(0,0,0,0.28);border-radius:8px;border:1px solid rgba(0,0,0,0.4);
    animation:standin .42s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes standin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .standing.win{border-color:var(--gold);box-shadow:0 0 14px rgba(233,196,90,0.45);background:rgba(233,196,90,0.14);}
  .standing .nm{display:flex;align-items:center;gap:8px;font-weight:700;}
  /* confetti */
  .confetti{position:fixed;top:0;width:9px;height:13px;z-index:32;pointer-events:none;border-radius:2px;will-change:transform;
    animation-name:confettifall;animation-timing-function:linear;animation-iteration-count:infinite;}
  .confetti.star{border-radius:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));}
  @keyframes confettifall{0%{transform:translate(0,-14vh) rotate(0);opacity:0}
    8%{opacity:1}92%{opacity:1}100%{transform:translate(var(--sway,0px),106vh) rotate(700deg);opacity:0.2}}
  .sheet{width:min(440px,92vw); max-height:88vh; overflow:auto;
    background:linear-gradient(rgba(70,40,16,0.55),rgba(35,20,8,0.72)), var(--wood-tex);
    background-size:cover; border:2px solid var(--gold-edge); border-radius:16px; padding:16px;
    box-shadow:0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,220,170,0.18);
    animation:sheetin .22s cubic-bezier(.2,.9,.3,1.2);}
  .sheet h2{font-size:22px;margin-bottom:10px;color:var(--gold);}
  .sheet h3{font-size:17px;margin-bottom:10px;color:var(--gold);}
  .trow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.3);}
  .trow input{background:rgba(0,0,0,0.3);border:1px solid var(--wood-edge);border-radius:8px;color:var(--ink);padding:9px;font-size:15px;flex:1;}
  .ctr{display:flex;align-items:center;gap:8px;}
  .ctr button{background:rgba(0,0,0,0.3);border:1px solid var(--wood-edge);color:var(--ink);width:32px;height:32px;border-radius:8px;font-size:18px;font-weight:800;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
  .full{width:100%;margin-top:10px;} .muted{color:var(--muted);font-size:13px;} .small{font-size:11px;}
  .seg{display:flex;gap:8px;margin-bottom:12px;}
  .seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--wood-edge);background:rgba(0,0,0,0.25);color:var(--ink);font-weight:700;}
  .seg button.on{background:linear-gradient(180deg,var(--gold),var(--gold-edge));color:#3a2400;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #000;}

  #toast{position:fixed; left:50%; bottom:150px; transform:translateX(-50%) translateY(16px);
    background:#000d;color:#fff;padding:9px 15px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;z-index:40;
    pointer-events:none;max-width:86%;text-align:center;border:1px solid var(--gold-edge);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Orientation locks (touch devices only — desktop is unaffected): every pre-game screen
     is locked to PORTRAIT, and only the board (body.ingame) forces LANDSCAPE. Held the
     wrong way, a full-screen rotate gate appears. */
  /* Orientation gate: pre-game screens want PORTRAIT, the board (body.ingame) wants LANDSCAPE.
     Held the wrong way on a phone, a full-screen "rotate your device" gate covers everything. */
  #rotate{display:none;}
  #rotate .ico{font-size:60px; animation:spin 2.4s ease-in-out infinite;}
  #rotate h2{color:var(--gold); font-size:24px;}
  #rotate p{color:#e8d9bf; max-width:300px;}
  #rotate .r-land, #rotate .r-port{display:none;}
  @media (orientation:portrait) and (pointer:coarse){   /* in a game + portrait -> rotate to landscape */
    body.ingame #stage, body.ingame #overlay, body.ingame #confirmbar, body.ingame #radialroot,
    body.ingame #radialtab, body.ingame #dicetab, body.ingame #trophytab, body.ingame #emotray, body.ingame #reactchip, body.ingame .emoghost, body.ingame #rpsroot, body.ingame .rpsb, body.ingame .rpscrown, body.ingame #cuppill, body.ingame #rmbar, body.ingame #settingstab, body.ingame #dicereveal, body.ingame #toast, body.ingame #tradeprompt{display:none !important;}
    body.ingame #rotate{display:flex !important; position:fixed; inset:0; z-index:200; flex-direction:column; align-items:center; justify-content:center;
      gap:16px; background:radial-gradient(120% 120% at 50% 40%, #1f4f74, #0a2336); text-align:center; padding:24px;}
    body.ingame #rotate .r-land{display:block;}
  }
  /* phones only: touch-primary (no hovering pointer) + phone-sized. Laptops/2-in-1s never match. */
  @media (orientation:landscape) and (hover:none) and (pointer:coarse) and (max-width:1000px){   /* menu held sideways -> rotate to portrait */
    body:not(.ingame) #title, body:not(.ingame) #overlay, body:not(.ingame) #cropper,
    body:not(.ingame) #toast, body:not(.ingame) #bctoast{display:none !important;}
    body:not(.ingame) #rotate{display:flex !important; position:fixed; inset:0; z-index:200; flex-direction:column; align-items:center; justify-content:center;
      gap:16px; background:radial-gradient(120% 120% at 50% 40%, #5a3a18, #221206); text-align:center; padding:24px;}
    body:not(.ingame) #rotate .r-port{display:block;}
  }
  @keyframes spin{0%,40%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)}}

  /* ---- motion / animation ---- */
  .corner.active{animation:panelpulse 1.6s ease-in-out infinite;}
  @keyframes panelpulse{0%,100%{box-shadow:0 0 10px rgba(233,196,90,0.45),0 4px 10px rgba(0,0,0,0.45);}
    50%{box-shadow:0 0 20px rgba(233,196,90,0.85),0 4px 10px rgba(0,0,0,0.45);}}
  .dice img.rolling, .pdice img.rolling{animation:tumble .6s cubic-bezier(.3,1.4,.5,1);}
  @keyframes tumble{0%{transform:rotate(-120deg) scale(0.5);opacity:.4}
    60%{transform:rotate(20deg) scale(1.18)}100%{transform:none;opacity:1}}
  #board.enter{animation:boardin .5s ease;}
  @keyframes boardin{from{opacity:0; transform:scale(0.94)} to{opacity:1; transform:none}}
  /* piece placement pop (applied to the most recently placed piece) */
  .popin{animation:piecepop .42s cubic-bezier(.2,1.3,.4,1); transform-box:fill-box; transform-origin:center bottom;}
  /* steal targets: victims' buildings pulse full-colour <-> faded, all in sync */
  .blink{animation:stealblink .85s ease-in-out infinite;}
  @keyframes stealblink{0%,100%{opacity:1} 50%{opacity:0.2}}
  @keyframes piecepop{0%{transform:translateY(-0.5px) scale(0.1);opacity:0;transform-origin:center bottom}
    70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
  @keyframes pop{50%{fill-opacity:0.15}}

  /* ---- title / menu scene (matches the app: cloth banner + wood table) ---- */
  /* inset:0 pins the title to the viewport; using a 100dvh height instead lets the
     mobile keyboard shrink it and not restore, leaving the blue stage showing below. */
  #title{position:fixed; inset:0; z-index:40;
    /* iOS standalone PWA pins bottom:0 to the safe-area edge, leaving the sea/blue
       showing under the home indicator — extend the wood past it so it fills. */
    bottom:calc(0px - env(safe-area-inset-bottom, 0px));
    box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
    display:flex; flex-direction:column; align-items:center; overflow:hidden;
    background-color:#2a1708;
    background-image:linear-gradient(rgba(45,24,10,0.30),rgba(18,9,3,0.55)), var(--wood-tex);
    background-size:auto, 360px 360px;
    background-repeat:repeat, repeat;
    background-position:center top, center top;}
  #title.hidden{display:none;}
  /* banner scales with viewport height so it never crowds out the form */
  .t-banner{width:100%; height:19vh; min-height:56px; max-height:140px; position:relative; overflow:hidden;
    background:linear-gradient(180deg,#7e1c14,#5e120c); box-shadow:0 5px 14px rgba(0,0,0,0.5); flex:0 0 auto;}
  .t-banner img{position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; object-position:center;}   /* show the whole flag, never crop the CATAN logo */
  /* fills remaining height; the card is scaled by JS (fitTitle) to always fit */
  .t-body{flex:1 1 auto; min-height:0; display:flex; width:100%; padding:8px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .t-card{transform-origin:center; margin:auto;}   /* auto-margins centre WITHOUT clipping when the body scrolls */
  .t-card{width:min(680px,94vw);
    background:linear-gradient(rgba(70,40,16,0.5),rgba(35,20,8,0.72)), var(--wood-tex); background-size:cover;
    border:2px solid var(--gold-edge); border-radius:14px; padding:16px 18px;
    box-shadow:0 14px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,220,170,0.18);}
  .t-card h3{font-family:var(--serif); color:var(--gold); font-size:22px; text-align:center; margin-bottom:12px;
    text-shadow:0 1px 2px #000;}
  /* bigger touch targets + readable names in the landscape menu */
  .t-card .btn{padding:18px 16px; font-size:17px;}
  .t-card .authlist .btn{padding:22px 16px;}   /* taller player tiles fill the landscape height */
  .t-card .seg{margin-bottom:8px;}
  .t-card .seg button{padding:7px;}
  .t-card .btn.full{margin-top:8px;}
  /* ===== New Game (pass & play) setup — big, readable; Demo tucked in the corner ===== */
  /* low-key secondary action: a small muted link, not a full button */
  .verline{margin:14px 0 2px; text-align:center; color:var(--muted); opacity:0.6; font-size:12px; letter-spacing:0.4px;}
  /* tertiary action: a quiet text link (same voice as the login screen's offline link) */
  .linkbtn{display:block; width:fit-content; margin:10px auto 2px; padding:6px 10px;
    background:none; border:none; box-shadow:none; color:var(--muted); opacity:0.7;
    font-size:14px; font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:inherit;}
  .linkbtn:active{opacity:1;}
  /* passive status (never a disabled button — buttons look tappable) */
  .lobstatus{text-align:center; color:#cbb489; font-size:14.5px; font-weight:600; padding:12px 8px 4px;}
  /* game-setup cluster: win target + your color live together */
  .lobsetup{border:1px solid rgba(255,220,170,0.14); border-radius:12px; padding:10px 12px; margin:10px 0 4px;
    display:flex; flex-direction:column; gap:8px;}
  .lobsetup .lobtgt, .lobsetup .lobprefrow{margin:0;}
  .t-card .small{margin-top:6px !important;}
</style>
</head>

          trade:{ bank:'assets/hud/trade/bank.png', give:'assets/hud/trade/arrow-give.png', get:'assets/hud/trade/arrow-get.png' },
          badge:{ road:'assets/hud/badge-road.png', army:'assets/hud/badge-army.png', vp:'assets/hud/badge-vp.png', card:'assets/hud/badge-card.png', res:'assets/hud/badge-res.png' },
